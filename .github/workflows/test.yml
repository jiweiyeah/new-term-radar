name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:   # a hand-run of the suite, when a push is not wanted or not enough

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt pytest mcp
      - run: python -m pytest -q tests
