name: New-term radar

# Two schedules, one state:
#   sources  every 8 hours: X and Hugging Face, where a name is said first. Posts a
#            report only when there is a new name.
#   daily    once a day: everything else, the review of leads from 14 days ago, and the
#            source leads of the last day.
#
# Off until you opt in: set the repository variable RADAR_ENABLED to "true"
# (Settings > Secrets and variables > Actions > Variables), add the secrets MONID_API_KEY
# and OPENAI_API_KEY (the model gateway), and commit your config.json (remove it from
# .gitignore first; it holds no secrets).
# Optional secrets: AISA_API_KEY (the second door, for the DataForSEO readings),
# TRUSTMRR_API_KEY (the weekly revenue signal),
# RESEND_API_KEY, EMAIL_FROM, RADAR_EMAIL_TO (mail the reports),
# FEISHU_WEBHOOK (push reports to a Feishu group),
# GSC_TOKEN_JSON (the Search Console signal).
#
# State (state/radar.db and the snapshots) lives in the Actions cache: one entry per
# run, restored by prefix, so the repository does not grow. A missing cache only means
# the next run builds new snapshots and reports nothing that day; the leads database
# would start over, so download the "radar-state" artifact now and then if you care
# about the review's history.

on:
  schedule:
    - cron: "*/5 * * * *"     # TEMPORARY: a five-minute cron, to prove the schedule trigger in this fork
    - cron: "30 1 * * *"       # daily
  workflow_dispatch:
    inputs:
      command:
        description: "daily or sources"
        default: "daily"

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  radar:
    if: vars.RADAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMMAND: ${{ github.event.inputs.command || (github.event.schedule == '30 1 * * *' && 'daily' || 'sources') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Restore the state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}
          restore-keys: radar-state-

      - name: Run the radar
        env:
          MONID_API_KEY: ${{ secrets.MONID_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AISA_API_KEY: ${{ secrets.AISA_API_KEY }}
          TRUSTMRR_API_KEY: ${{ secrets.TRUSTMRR_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GSC_TOKEN_JSON: ${{ secrets.GSC_TOKEN_JSON }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RADAR_EMAIL_TO: ${{ secrets.RADAR_EMAIL_TO }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          if [ "$COMMAND" = "daily" ]; then
            python -m radar daily --skip x,hf --out report.md --mail
          else
            python -m radar sources --out report.md --mail
          fi
          if [ -f report.md ]; then cat report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Save the state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}

      - name: Keep the report and the state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-${{ env.COMMAND }}-${{ github.run_id }}
          path: |
            report.md
            report.json
            state/radar.db
          if-no-files-found: ignore
          retention-days: 30
